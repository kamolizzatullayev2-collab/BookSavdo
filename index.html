<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f47721">
<title>BookSavdo</title>
<style>
:root{--o:#f47721;--bg:#fffaf5;--line:#f0e8e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#292929;padding-bottom:85px}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:linear-gradient(110deg,#f47721,#ff963f);color:white;padding:16px}
header h2{margin:0}
header p{margin:5px 0 0;font-size:12px}
main{max-width:750px;margin:auto;padding:15px}
.page{display:none}.page.active{display:block}
.welcome{background:#ffeadb;padding:18px;border-radius:16px;margin-bottom:15px}
.welcome h2{margin:0 0 7px;font-size:21px}
.search{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:white}
.chips{display:flex;gap:8px;overflow:auto;padding:14px 0}
.chips button{white-space:nowrap;border:1px solid #eee;background:white;border-radius:20px;padding:9px 13px}
.chips button.active{background:var(--o);color:white}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.book{background:white;border:1px solid var(--line);border-radius:14px;padding:9px;min-width:0}
.book img{width:100%;height:150px;object-fit:cover;border-radius:10px}
.placeholder{height:150px;background:#fff0e3;border-radius:10px;display:grid;place-items:center;font-size:48px}
.book h3{font-size:14px;margin:9px 0 4px}
.muted{font-size:12px;color:#888}
.price{font-size:16px;font-weight:bold;color:var(--o);margin:9px 0}
.book button,.book a{display:block;width:100%;padding:10px;border:0;border-radius:9px;margin-top:7px;text-align:center;text-decoration:none;font-size:13px}
.open{background:#fff0e5;color:#bd5a14}
.phone{background:#1e9d55;color:white}
.telegram{background:#229ed9;color:white}
.danger{background:#ffe8e8;color:#b22}
.green{background:#e6f6e9;color:#18763a}
.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:15px;margin:12px 0}
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}
.field input,.field select,.field textarea,.auth input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px}
textarea{min-height:95px}
.primary{width:100%;padding:14px;background:var(--o);color:white;border:0;border-radius:11px;font-weight:bold}
.preview{width:100%;max-height:220px;object-fit:contain;display:none;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:white;border-top:1px solid #eee;display:flex;height:72px;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:white;color:#777;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
nav button span{font-size:22px}
nav button.active{color:var(--o);font-weight:bold}
.detail-img{width:100%;max-height:330px;object-fit:contain;background:#fff0e3;border-radius:14px}
.detail-title{font-size:23px}
.contact{display:flex;gap:8px}
.contact a{flex:1;padding:13px 5px;text-align:center;text-decoration:none;color:white;background:#1e9d55;border-radius:10px;font-size:13px}
.contact .tg{background:#229ed9}
.empty{grid-column:1/-1;text-align:center;color:#888;padding:30px}
.stats{display:flex;gap:8px;margin:12px 0}
.stat{flex:1;text-align:center;background:#fff1e6;border-radius:10px;padding:10px}
.stat b{display:block;color:var(--o);font-size:20px}
</style>
</head>
<body>

<header>
<h2>📚 BookSavdo</h2>
<p>Kitobga ikkinchi hayot!</p>
</header>

<main>
<section class="page active" id="home">
<div class="welcome">
<h2>Sevimli kitobingizni toping 📖</h2>
<p>O‘qilgan kitoblarni hamyonbop narxlarda xarid qiling.</p>
</div>
<input class="search" id="homeSearch" placeholder="🔍 Kitob yoki muallifni qidiring">
<div class="chips" id="categories"></div>
<h3>Yangi kitoblar</h3>
<div class="grid" id="bookGrid"></div>
</section>

<section class="page" id="searchPage">
<h2>🔍 Qidiruv</h2>
<input class="search" id="searchInput" placeholder="Kitob nomi yoki muallif">
<div class="grid" id="searchGrid"></div>
</section>

<section class="page" id="sellPage">
<h2 id="sellTitle">➕ Kitob sotish</h2>
<div class="panel">
<form id="bookForm">
<div class="field">
<label>Kitob rasmi</label>
<input type="file" id="photo" accept="image/*">
<img id="preview" class="preview" alt="Kitob rasmi">
</div>
<div class="field"><label>Kitob nomi *</label><input id="title" required placeholder="O‘tkan kunlar"></div>
<div class="field"><label>Muallif *</label><input id="author" required></div>
<div class="field"><label>Narxi (so‘m) *</label><input id="price" type="number" min="1" required></div>
<div class="field"><label>Kategoriya</label>
<select id="category">
<option>Badiiy adabiyot</option><option>Biznes va iqtisod</option>
<option>Tarix</option><option>Ilmiy-ommabop</option>
<option>Bolalar kitoblari</option><option>Darslik va qo‘llanma</option>
<option>Diniy adabiyot</option><option>Boshqa</option>
</select></div>
<div class="field"><label>Kitob holati</label>
<select id="condition">
<option>Yaxshi holatda</option><option>Yangi kabi</option>
<option>O‘qilgan, ayrim izlari bor</option><option>Ta’mirlash kerak</option>
</select></div>
<div class="field"><label>Kitob nima haqida?</label><textarea id="description" placeholder="Kitob mazmunini qisqacha yozing..."></textarea></div>
<div class="field"><label>Shahar yoki tuman *</label><input id="location" required placeholder="Toshkent, Chilonzor"></div>
<div class="field"><label>Telefon raqami *</label><input id="phone" type="tel" required placeholder="+998901234567"></div>
<div class="field"><label>Telegram username</label><input id="telegram" placeholder="@username"></div>
<button class="primary" id="submitBook">📚 E’lonni joylash</button>
<button type="button" id="cancelEdit" class="primary" style="background:#777;display:none" onclick="resetForm()">Bekor qilish</button>
</form>
</div>
</section>

<section class="page" id="favoritesPage">
<h2>❤️ Sevimlilar</h2>
<div class="grid" id="favoriteGrid"></div>
</section>

<section class="page" id="profilePage">
<div id="profileContent"></div>
</section>

<section class="page" id="detailPage">
<button onclick="go('home')" style="border:0;background:none;color:#f47721;padding:10px 0">← Orqaga</button>
<div id="detailContent"></div>
</section>

<section class="page" id="authPage">
<h2 id="authTitle">Akkaunt yaratish</h2>
<div class="panel auth">
<form id="authForm">
<input id="fullName" placeholder="Ismingiz" required>
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Parol (kamida 6 belgi)" required>
<button class="primary" id="authSubmit">Ro‘yxatdan o‘tish</button>
</form>
<button onclick="toggleAuthMode()" id="authSwitch" style="border:0;background:none;color:#f47721;padding:15px">Akkauntingiz bormi? Kirish</button>
</div>
</section>
</main>

<nav>
<button class="active" onclick="go('home')"><span>🏠</span>Bosh sahifa</button>
<button onclick="go('searchPage')"><span>🔍</span>Qidiruv</button>
<button onclick="startSell()"><span>➕</span>Sotish</button>
<button onclick="go('favoritesPage')"><span>❤️</span>Sevimli</button>
<button onclick="go('profilePage')"><span>👤</span>Profil</button>
</nav>

<script>
const KEY="booksavdo_data_v2";
let db=JSON.parse(localStorage.getItem(KEY)||"null")||{users:[],books:[],favorites:{}};
let currentUser=localStorage.getItem("booksavdo_user")||"";
let selectedImage="",editingId=null,authMode="register",previousPage="profile";
let activeCategory="Barchasi";

function saveDB(){
try{localStorage.setItem(KEY,JSON.stringify(db));return true}
catch(e){alert("Xotira to‘ldi. Kichikroq rasm tanlang.");return false}
}
function user(){return db.users.find(u=>u.id===currentUser)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){alert(s)}
function isFav(id){return (db.favorites[currentUser]||[]).includes(id)}
function go(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
let map={home:0,searchPage:1,sellPage:2,favoritesPage:3,profilePage:4};
if(map[id]!==undefined)document.querySelectorAll("nav button")[map[id]].classList.add("active");
if(id==="home")render();
if(id==="searchPage")renderSearch();
if(id==="favoritesPage")renderFavorites();
if(id==="profilePage")renderProfile();
window.scrollTo(0,0);
}
function startSell(){
if(!user()){previousPage="sellPage";go("authPage");return}
resetForm();go("sellPage");
}
const cats=["Barchasi","Badiiy adabiyot","Biznes va iqtisod","Tarix","Ilmiy-ommabop","Bolalar kitoblari","Darslik va qo‘llanma","Diniy adabiyot","Boshqa"];
function renderCategories(){
document.getElementById("categories").innerHTML=cats.map(c=>`<button class="${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${esc(c)}</button>`).join("");
}
function setCategory(c){activeCategory=c;renderCategories();render()}
function bookCard(b){
return `<article class="book" onclick="openBook('${b.id}')">
${b.image?`<img src="${b.image}" alt="${esc(b.title)}">`:'<div class="placeholder">📚</div>'}
<h3>${esc(b.title)}</h3>
<div class="muted">${esc(b.author)}</div>
<div class="price">${Number(b.price).toLocaleString("uz-UZ")} so‘m</div>
<div class="muted">📍 ${esc(b.location||"Joylashuv yo‘q")}</div>
${b.sold?'<div class="muted">SOTILGAN</div>':''}
<button class="open" onclick="event.stopPropagation();openBook('${b.id}')">Batafsil ko‘rish</button>
</article>`;
}
function render(){
let q=document.getElementById("homeSearch").value.toLowerCase();
let list=db.books.filter(b=>!b.sold&&(activeCategory==="Barchasi"||b.category===activeCategory)&&(b.title+" "+b.author+" "+b.description+" "+b.location).toLowerCase().includes(q));
document.getElementById("bookGrid").innerHTML=list.map(bookCard).join("")||'<div class="empty">Hozircha kitob yo‘q</div>';
}
function renderSearch(){
let q=document.getElementById("searchInput").value.toLowerCase();
let list=db.books.filter(b=>!b.sold&&(b.title+" "+b.author+" "+b.description+" "+b.location).toLowerCase().includes(q));
document.getElementById("searchGrid").innerHTML=list.map(bookCard).join("")||'<div class="empty">Kitob topilmadi</div>';
}
function renderFavorites(){
let ids=db.favorites[currentUser]||[];
let list=db.books.filter(b=>ids.includes(b.id)&&!b.sold);
document.getElementById("favoriteGrid").innerHTML=list.map(bookCard).join("")||'<div class="empty">Sevimlilar hozircha bo‘sh</div>';
}
function openBook(id){
let b=db.books.find(x=>x.id===id);if(!b)return;
let own=user()&&b.owner===currentUser;
let html=b.image?`<img class="detail-img" src="${b.image}" alt="${esc(b.title)}">`:'<div class="placeholder">📚</div>';
html+=`<h1 class="detail-title">${esc(b.title)}</h1>
<div>${esc(b.author)}</div>
<div class="price">${Number(b.price).toLocaleString("uz-UZ")} so‘m</div>
<p><b>${esc(b.category)}</b> · ${esc(b.condition)}</p>
<div class="panel"><b>📖 Kitob haqida</b><p>${esc(b.description||"Tavsif kiritilmagan")}</p></div>
<div class="panel"><b>📍 Sotuvchi joylashuvi</b><p>${esc(b.location)}</p><p>Sotuvchi: ${esc(b.sellerName)}</p></div>`;
if(!own){
html+=`<div class="panel"><b>☎️ Sotuvchi bilan aloqa</b><div class="contact">
<a href="tel:${esc(b.phone)}">📞 ${esc(b.phone)}</a>
${b.telegram?`<a class="tg" href="https://t.me/${encodeURIComponent(b.telegram.replace("@",""))}" target="_blank">✈️ ${esc(b.telegram)}</a>`:""}
</div></div>
<button class="primary" onclick="toggleFav('${b.id}')">${isFav(b.id)?"❤️ Sevimlidan olish":"♡ Sevimliga qo‘shish"}</button>`;
}else{
html+=`<div class="panel"><b>Bu sizning e’loningiz</b>
<button class="primary" onclick="editBook('${b.id}')">✏️ Tahrirlash</button>
<button class="primary" style="background:#23864b" onclick="markSold('${b.id}')">${b.sold?"Qayta sotuvga chiqarish":"✓ Sotildi deb belgilash"}</button>
<button class="primary" style="background:#c73535" onclick="deleteBook('${b.id}')">🗑 E’lonni o‘chirish</button>
</div>`;
}
document.getElementById("detailContent").innerHTML=html;go("detailPage");
}
function toggleFav(id){
if(!user()){previousPage="favoritesPage";go("authPage");return}
let a=db.favorites[currentUser]||[];
db.favorites[currentUser]=a.includes(id)?a.filter(x=>x!==id):[...a,id];
saveDB();renderFavorites();render();
}
function renderProfile(){
let box=document.getElementById("profileContent"),u=user();
if(!u){
box.innerHTML=`<div class="panel"><h2>👤 Shaxsiy akkaunt</h2><p>O‘z kitoblaringizni joylash va boshqarish uchun akkaunt yarating.</p><button class="primary" onclick="previousPage='profilePage';go('authPage')">Kirish / Ro‘yxatdan o‘tish</button></div>`;
return;
}
let mine=db.books.filter(b=>b.owner===u.id);
box.innerHTML=`<div class="panel"><h2>👤 ${esc(u.name)}</h2><div class="muted">${esc(u.email)}</div>
<div class="stats"><div class="stat"><b>${mine.length}</b>E’lonlarim</div><div class="stat"><b>${mine.filter(b=>!b.sold).length}</b>Sotuvda</div><div class="stat"><b>${mine.filter(b=>b.sold).length}</b>Sotilgan</div></div></div>
<h3>Mening kitoblarim</h3>
<div class="grid">${mine.map(b=>`<article class="book" onclick="openBook('${b.id}')">${b.image?`<img src="${b.image}">`:'<div class="placeholder">📚</div>'}<h3>${esc(b.title)}</h3><div class="price">${Number(b.price).toLocaleString("uz-UZ")} so‘m</div><button class="open" onclick="event.stopPropagation();editBook('${b.id}')">✏️ Tahrirlash</button><button class="danger" onclick="event.stopPropagation();deleteBook('${b.id}')">🗑 O‘chirish</button></article>`).join("")||'<div class="empty">Hali kitob joylamagansiz</div>'}</div>
<div class="panel"><button class="danger" onclick="logout()">Akkauntdan chiqish</button></div>`;
}
function resetForm(){
editingId=null;selectedImage="";
document.getElementById("bookForm").reset();
document.getElementById("preview").style.display="none";
document.getElementById("sellTitle").textContent="➕ Kitob sotish";
document.getElementById("submitBook").textContent="📚 E’lonni joylash";
document.getElementById("cancelEdit").style.display="none";
}
function editBook(id){
let b=db.books.find(x=>x.id===id);
if(!b||!user()||b.owner!==currentUser)return;
editingId=id;selectedImage=b.image||"";
["title","author","price","category","condition","description","location","phone","telegram"].forEach(k=>document.getElementById(k).value=b[k]||"");
if(selectedImage){document.getElementById("preview").src=selectedImage;document.getElementById("preview").style.display="block"}
document.getElementById("sellTitle").textContent="✏️ E’lonni tahrirlash";
document.getElementById("submitBook").textContent="💾 Saqlash";
document.getElementById("cancelEdit").style.display="block";
go("sellPage");
}
function deleteBook(id){
let b=db.books.find(x=>x.id===id);
if(!b||!user()||b.owner!==currentUser){toast("Faqat o‘z e’loningizni o‘chira olasiz");return}
if(!confirm("E’lonni butunlay o‘chirasizmi?"))return;
db.books=db.books.filter(x=>x.id!==id);
Object.keys(db.favorites).forEach(k=>db.favorites[k]=(db.favorites[k]||[]).filter(x=>x!==id));
saveDB();renderProfile();render();go("profilePage");toast("E’lon o‘chirildi");
}
function markSold(id){
let b=db.books.find(x=>x.id===id);
if(!b||!user()||b.owner!==currentUser)return;
b.sold=!b.sold;saveDB();openBook(id);
}
function resetImage(){
selectedImage="";
document.getElementById("preview").style.display="none";
}
document.getElementById("photo").addEventListener("change",function(){
let f=this.files[0];if(!f)return;
if(!f.type.startsWith("image/")){alert("Rasm tanlang");this.value="";return}
if(f.size>5*1024*1024){alert("Rasm 5 MB dan kichik bo‘lsin");this.value="";return}
let reader=new FileReader();
reader.onload=e=>{
let img=new Image();
img.onload=()=>{
let c=document.createElement("canvas"),scale=Math.min(1,900/Math.max(img.width,img.height));
c.width=img.width*scale;c.height=img.height*scale;
c.getContext("2d").drawImage(img,0,0,c.width,c.height);
selectedImage=c.toDataURL("image/jpeg",.75);
let p=document.getElementById("preview");p.src=selectedImage;p.style.display="block";
};
img.src=e.target.result;
};
reader.readAsDataURL(f);
});
document.getElementById("bookForm").addEventListener("submit",e=>{
e.preventDefault();
let u=user();if(!u){previousPage="sellPage";go("authPage");return}
if(!selectedImage){alert("Kitob rasmini tanlang");return}
let phone=document.getElementById("phone").value.trim();
if(!/^[+\d][\d\s()-]{6,}$/.test(phone)){alert("Telefon raqamini tekshiring");return}
let tg=document.getElementById("telegram").value.trim();
if(tg&&!/^@?[A-Za-z0-9_]{5,32}$/.test(tg)){alert("Telegram username noto‘g‘ri");return}
let data={
title:document.getElementById("title").value.trim(),
author:document.getElementById("author").value.trim(),
price:Number(document.getElementById("price").value),
category:document.getElementById("category").value,
condition:document.getElementById("condition").value,
description:document.getElementById("description").value.trim(),
location:document.getElementById("location").value.trim(),
phone,telegram:tg,image:selectedImage,sellerName:u.name
};
if(editingId){
let b=db.books.find(x=>x.id===editingId);
if(!b||b.owner!==u.id)return;
Object.assign(b,data);
}else{
db.books.unshift({id:"b"+Date.now(),...data,owner:u.id,sold:false});
}
if(!saveDB())return;
resetForm();render();renderProfile();go("profilePage");
alert(editingId?"E’lon yangilandi":"Kitob e’lon qilindi!");
});
function toggleAuthMode(){
authMode=authMode==="register"?"login":"register";
document.getElementById("authTitle").textContent=authMode==="register"?"Akkaunt yaratish":"Akkauntga kirish";
document.getElementById("fullName").style.display=authMode==="login"?"none":"block";
document.getElementById("fullName").required=authMode==="register";
document.getElementById("authSubmit").textContent=authMode==="register"?"Ro‘yxatdan o‘tish":"Kirish";
document.getElementById("authSwitch").textContent=authMode==="register"?"Akkauntingiz bormi? Kirish":"Akkauntingiz yo‘qmi? Ro‘yxatdan o‘tish";
}
document.getElementById("authForm").addEventListener("submit",e=>{
e.preventDefault();
let email=document.getElementById("email").value.trim().toLowerCase();
let pass=document.getElementById("password").value;
if(pass.length<6){alert("Parol kamida 6 belgidan iborat bo‘lsin");return}
if(authMode==="register"){
if(db.users.some(u=>u.email===email)){alert("Bu email bilan akkaunt mavjud");return}
let u={id:"u"+Date.now(),name:document.getElementById("fullName").value.trim(),email,pass};
if(!u.name){alert("Ismingizni yozing");return}
db.users.push(u);currentUser=u.id;
}else{
let u=db.users.find(u=>u.email===email&&u.pass===pass);
if(!u){alert("Email yoki parol noto‘g‘ri");return}
currentUser=u.id;
}
localStorage.setItem("booksavdo_user",currentUser);saveDB();
go(previousPage==="sellPage"?"sellPage":"profilePage");
alert("Xush kelibsiz!");
});
function logout(){
if(!confirm("Akkauntdan chiqasizmi?"))return;
currentUser="";localStorage.removeItem("booksavdo_user");go("home");
}
renderCategories();render();renderProfile();
if(user())document.querySelector("header button")?.remove();
</script>
</body>
</html>
