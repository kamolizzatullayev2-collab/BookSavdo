<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookSavdo — Kitobga ikkinchi hayot!</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #222;
    }

    header {
      background: #fff;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      box-shadow: 0 2px 10px #0000000c;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      color: #f47721;
    }

    .logo span {
      color: #222;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 9px;
      padding: 11px 16px;
      font-weight: bold;
      font-size: 14px;
    }

    .primary {
      background: #f47721;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #ffe5e5;
      color: #c62828;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 16px;
    }

    .hero {
      background: linear-gradient(120deg, #fff0e5, #fff);
      border-radius: 18px;
      padding: 35px 25px;
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 18px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      margin-top: 7px;
      margin-bottom: 14px;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    label {
      font-size: 14px;
      font-weight: bold;
    }

    .search-area {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-area input,
    .search-area select {
      margin: 0;
    }

    .section-title {
      font-size: 22px;
      margin: 25px 0 15px;
    }

    .books {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }

    .book {
      background: white;
      border-radius: 13px;
      overflow: hidden;
      box-shadow: 0 2px 10px #0000000b;
    }

    .book img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: #eee;
    }

    .book-info {
      padding: 13px;
    }

    .book-info h3 {
      font-size: 17px;
      margin-bottom: 7px;
    }

    .muted {
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .price {
      color: #f47721;
      font-size: 19px;
      font-weight: 900;
      margin: 10px 0;
    }

    .book-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .book-actions button {
      flex: 1;
      padding: 9px 7px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 13px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none !important;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 20px 0;
    }

    .tabs button {
      background: #eee;
    }

    .tabs button.active {
      background: #f47721;
      color: white;
    }

    .status {
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      background: #fff2e8;
      color: #a94c0b;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #888;
      margin-top: 30px;
    }

    @media(max-width: 600px) {
      .hero h1 {
        font-size: 24px;
      }

      .search-area {
        grid-template-columns: 1fr;
      }

      header {
        padding: 13px;
      }

      .container {
        padding: 17px 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">Book<span>Savdo</span></div>

  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="secondary" onclick="showSection('home')">Bosh sahifa</button>
    <button class="secondary" onclick="showSection('favorites')">♡ Sevimlilar</button>
    <button class="secondary" onclick="showSection('profile')">Mening profilim</button>
    <button class="primary" onclick="showSection('add')">+ Kitob sotish</button>
  </div>
</header>

<main class="container">

  <section id="homeSection">

    <div class="hero">
      <h1>Kitobga ikkinchi hayot!</h1>
      <p>O‘qib bo‘lgan kitoblaringizni soting yoki o‘zingizga kerakli kitoblarni arzon narxda toping.</p>
      <button class="primary" onclick="showSection('add')">Kitob joylash</button>
    </div>

    <div class="search-area">
      <input id="searchInput" placeholder="Kitob nomi yoki muallifini qidiring..." oninput="renderBooks()">

      <select id="categoryFilter" onchange="renderBooks()">
        <option value="">Barcha kategoriyalar</option>
        <option value="Badiiy">Badiiy</option>
        <option value="Roman">Roman</option>
        <option value="Tarix">Tarix</option>
        <option value="Biznes">Biznes</option>
        <option value="Psixologiya">Psixologiya</option>
        <option value="Bolalar">Bolalar</option>
        <option value="Darslik">Darslik</option>
        <option value="Boshqa">Boshqa</option>
      </select>
    </div>

    <h2 class="section-title">Yangi kitoblar</h2>
    <div id="booksList" class="books">Yuklanmoqda...</div>

  </section>

  <section id="addSection" class="hidden">
    <div class="panel">
      <h2 class="section-title">Kitob joylash</h2>

      <div id="addMessage" class="status hidden"></div>

      <form id="bookForm">

        <label>Kitob nomi</label>
        <input id="bookTitle" required placeholder="Masalan: O‘tkan kunlar">

        <label>Muallif</label>
        <input id="bookAuthor" required placeholder="Muallif ismi">

        <label>Narxi (so‘m)</label>
        <input id="bookPrice" type="number" min="0" required placeholder="50000">

        <label>Kategoriya</label>
        <select id="bookCategory" required>
          <option value="">Tanlang</option>
          <option>Badiiy</option>
          <option>Roman</option>
          <option>Tarix</option>
          <option>Biznes</option>
          <option>Psixologiya</option>
          <option>Bolalar</option>
          <option>Darslik</option>
          <option>Boshqa</option>
        </select>

        <label>Kitob holati</label>
        <select id="bookCondition" required>
          <option value="Yaxshi">Yaxshi</option>
          <option value="Juda yaxshi">Juda yaxshi</option>
          <option value="O‘rtacha">O‘rtacha</option>
          <option value="Eski">Eski</option>
        </select>

        <label>Kitob haqida qisqacha ma’lumot</label>
        <textarea id="bookDescription" placeholder="Kitob nima haqida?"></textarea>

        <label>Shahar</label>
        <input id="bookCity" placeholder="Masalan: Toshkent">

        <label>Tuman</label>
        <input id="bookDistrict" placeholder="Masalan: Chilonzor">

        <label>Telefon raqam</label>
        <input id="bookPhone" type="tel" placeholder="+998901234567">

        <label>Telegram username</label>
        <input id="bookTelegram" placeholder="username">

        <label>Kitob rasmi</label>
        <input id="bookImage" type="file" accept="image/*" required>

        <button class="primary" type="submit" id="submitBook">
          Kitobni joylash
        </button>
      </form>
    </div>
  </section>

  <section id="favoritesSection" class="hidden">
    <h2 class="section-title">Sevimli kitoblarim</h2>
    <div id="favoritesList" class="books"></div>
  </section>

  <section id="profileSection" class="hidden">

    <div class="panel">
      <h2 class="section-title">Mening profilim</h2>

      <div id="profileInfo"></div>

      <div id="authArea">

        <div class="tabs">
          <button id="loginTab" class="active" onclick="showAuth('login')">Kirish</button>
          <button id="registerTab" onclick="showAuth('register')">Ro‘yxatdan o‘tish</button>
        </div>

        <div id="authMessage" class="status hidden"></div>

        <form id="authForm">

          <div id="nameFields" class="hidden">
            <label>Ism</label>
            <input id="firstName" placeholder="Ismingiz">

            <label>Familiya</label>
            <input id="lastName" placeholder="Familiyangiz">
          </div>

          <label>Telefon raqam</label>
          <input id="authPhone" type="tel" required placeholder="+998901234567">

          <label>Parol</label>
          <input id="authPassword" type="password" required minlength="6" placeholder="Kamida 6 ta belgi">

          <button class="primary" type="submit" id="authSubmit">Kirish</button>
        </form>

      </div>

      <div id="loggedInArea" class="hidden">
        <button class="danger" onclick="logout()">Hisobdan chiqish</button>
      </div>
    </div>

    <div class="panel">
      <h2 class="section-title">Men joylagan kitoblar</h2>
      <div id="myBooks" class="books">Avval tizimga kiring.</div>
    </div>

  </section>

</main>

<footer>
  <b>BookSavdo</b>
  <p>Kitobga ikkinchi hayot!</p>
</footer>

<script>
const SUPABASE_URL = "https://lszzpfiptmgsjrrrkdwj.supabase.co";

const SUPABASE_KEY = "sb_publishable_G72FGzaa4mFQe5PS77dZaQ_cZUlF3O5";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentProfile = null;
let allBooks = [];
let authMode = "login";

const $ = id => document.getElementById(id);

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[char]);
}

function money(value) {
  return Number(value || 0).toLocaleString("uz-UZ") + " so‘m";
}

function showMessage(id, message) {
  const box = $(id);
  box.textContent = message;
  box.classList.remove("hidden");
}

function hideMessage(id) {
  $(id).classList.add("hidden");
}

function showSection(section) {
  [
    "homeSection",
    "addSection",
    "favoritesSection",
    "profileSection"
  ].forEach(id => $(id).classList.add("hidden"));

  $(section + "Section").classList.remove("hidden");

  if (section === "favorites") renderFavorites();
  if (section === "profile") loadProfile();
  if (section === "add" && !currentUser) {
    showSection("profile");
    showMessage("authMessage", "Kitob joylash uchun avval hisobingizga kiring.");
  }
}

function showAuth(mode) {
  authMode = mode;

  $("nameFields").classList.toggle("hidden", mode !== "register");

  $("loginTab").classList.toggle("active", mode === "login");
  $("registerTab").classList.toggle("active", mode === "register");

  $("authSubmit").textContent =
    mode === "login" ? "Kirish" : "Ro‘yxatdan o‘tish";

  hideMessage("authMessage");
}

function normalizePhone(phone) {
  let value = phone.replace(/\s+/g, "").replace(/-/g, "");

  if (value.startsWith("00")) {
    value = "+" + value.slice(2);
  }

  if (value.startsWith("998")) {
    value = "+" + value;
  }

  if (value.startsWith("0") && value.length === 10) {
    value = "+998" + value.slice(1);
  }

  return value;
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();

  hideMessage("authMessage");

  const phone = normalizePhone($("authPhone").value);
  const password = $("authPassword").value;

  if (!/^\+998\d{9}$/.test(phone)) {
    showMessage("authMessage", "Telefon raqamni +998901234567 ko‘rinishida kiriting.");
    return;
  }

  $("authSubmit").disabled = true;
  $("authSubmit").textContent = "Kutilmoqda...";

  try {
    let result;

    if (authMode === "register") {
      const firstName = $("firstName").value.trim();
      const lastName = $("lastName").value.trim();

      if (!firstName || !lastName) {
        throw new Error("Ism va familiyangizni kiriting.");
      }

      result = await db.auth.signUp({
        phone,
        password,
        options: {
          data: {
            first_name: firstName,
            last_name: lastName
          }
        }
      });

    } else {
      result = await db.auth.signInWithPassword({
        phone,
        password
      });
    }

    if (result.error) throw result.error;

    if (authMode === "register" && !result.data.session) {
      showMessage(
        "authMessage",
        "Ro‘yxatdan o‘tish so‘rovi yuborildi. Supabase telefon tasdiqlashni talab qilmoqda. Phone provider va Confirm phone sozlamalarini tekshiring."
      );
      return;
    }

    currentUser = result.data.user;
    currentProfile = currentUser.user_metadata || {};

    showMessage("authMessage", "Muvaffaqiyatli!");

    await loadProfile();
    await loadBooks();

  } catch (error) {
    showMessage("authMessage", error.message || "Xatolik yuz berdi.");
  } finally {
    $("authSubmit").disabled = false;
    $("authSubmit").textContent =
      authMode === "login" ? "Kirish" : "Ro‘yxatdan o‘tish";
  }
});

async function logout() {
  const { error } = await db.auth.signOut();

  if (error) {
    alert(error.message);
    return;
  }

  currentUser = null;
  currentProfile = null;

  await loadProfile();
  await loadBooks();

  showSection("home");
}

async function loadProfile() {
  const { data } = await db.auth.getUser();

  currentUser = data.user || null;
  currentProfile = currentUser?.user_metadata || null;

  if (currentUser) {
    $("authArea").classList.add("hidden");
    $("loggedInArea").classList.remove("hidden");

    $("profileInfo").innerHTML = `
      <p><b>Ism:</b> ${esc(currentProfile?.first_name || "")}</p>
      <p><b>Familiya:</b> ${esc(currentProfile?.last_name || "")}</p>
      <p><b>Telefon:</b> ${esc(currentUser.phone || "")}</p>
    `;

    await loadMyBooks();

  } else {
    $("authArea").classList.remove("hidden");
    $("loggedInArea").classList.add("hidden");

    $("profileInfo").innerHTML = "<p>Hisobingizga kiring yoki yangi hisob yarating.</p>";
    $("myBooks").textContent = "Avval tizimga kiring.";
  }
}

async function uploadImage(file) {
  if (!currentUser) throw new Error("Avval tizimga kiring.");

  const extension = file.name.split(".").pop().toLowerCase();
  const safeExtension = /^[a-z0-9]+$/.test(extension) ? extension : "jpg";
  const path = currentUser.id + "/" + crypto.randomUUID() + "." + safeExtension;

  const { error } = await db.storage
    .from("book-images")
    .upload(path, file, {
      cacheControl: "3600",
      upsert: false,
      contentType: file.type
    });

  if (error) throw error;

  const { data } = db.storage
    .from("book-images")
    .getPublicUrl(path);

  return data.publicUrl;
}

$("bookForm").addEventListener("submit", async event => {
  event.preventDefault();

  hideMessage("addMessage");

  if (!currentUser) {
    showMessage("addMessage", "Avval tizimga kiring.");
    return;
  }

  const file = $("bookImage").files[0];

  if (!file) {
    showMessage("addMessage", "Kitob rasmini tanlang.");
    return;
  }

  if (!file.type.startsWith("image/")) {
    showMessage("addMessage", "Faqat rasm faylini tanlang.");
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    showMessage("addMessage", "Rasm hajmi 5 MB dan oshmasligi kerak.");
    return;
  }

  $("submitBook").disabled = true;
  $("submitBook").textContent = "Yuklanmoqda...";

  try {
    const imageUrl = await uploadImage(file);

    const book = {
      title: $("bookTitle").value.trim(),
      author: $("bookAuthor").value.trim(),
      price: Number($("bookPrice").value),
      cat: $("bookCategory").value,
      cond: $("bookCondition").value,
      description: $("bookDescription").value.trim(),
      city: $("bookCity").value.trim(),
      district: $("bookDistrict").value.trim(),
      phone: $("bookPhone").value.trim(),
      telegram: $("bookTelegram").value.trim().replace("@", ""),
      contact: $("bookPhone").value.trim(),
      seller_id: currentUser.id,
      user_id: currentUser.id,
      image_url: imageUrl,
      is_sold: false
    };

    const { error } = await db.from("books").insert(book);

    if (error) throw error;

    $("bookForm").reset();

    showMessage("addMessage", "Kitobingiz muvaffaqiyatli joylandi!");

    await loadBooks();
    await loadMyBooks();

    showSection("home");

  } catch (error) {
    showMessage("addMessage", "Xatolik: " + error.message);
  } finally {
    $("submitBook").disabled = false;
    $("submitBook").textContent = "Kitobni joylash";
  }
});

async function loadBooks() {
  $("booksList").textContent = "Yuklanmoqda...";

  const { data, error } = await db
    .from("books")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    $("booksList").textContent = "Xatolik: " + error.message;
    return;
  }

  allBooks = data || [];
  renderBooks();
}

function bookCard(book) {
  const image = book.image_url || "";

  const phone = book.phone || book.contact || "";
  const telegram = (book.telegram || "").replace("@", "");

  const isFavorite = getFavorites().includes(book.id);

  const location = [book.city, book.district]
    .filter(Boolean)
    .map(esc)
    .join(", ");

  return `
    <article class="book">

      <img
        src="${esc(image)}"
        alt="${esc(book.title)}"
        onerror="this.src='https://placehold.co/400x300?text=BookSavdo'"
      >

      <div class="book-info">

        <h3>${esc(book.title)}</h3>

        <p class="muted">${esc(book.author)}</p>

        <p class="price">${money(book.price)}</p>

        <p class="muted">Kategoriya: ${esc(book.cat)}</p>
        <p class="muted">Holati: ${esc(book.cond)}</p>

        ${location ? `<p class="muted">📍 ${location}</p>` : ""}

        ${book.is_sold ? `<p style="color:red;font-weight:bold">Sotilgan</p>` : ""}

        <div class="book-actions">
          <button class="secondary" onclick="showDetails('${book.id}')">Batafsil</button>

          <button class="secondary" onclick="toggleFavorite('${book.id}')">
            ${isFavorite ? "♥" : "♡"}
          </button>
        </div>

        ${!book.is_sold && phone ? `
          <div class="book-actions">
            <button class="primary" onclick="callSeller('${esc(phone)}')">Qo‘ng‘iroq</button>
          </div>
        ` : ""}

        ${!book.is_sold && telegram ? `
          <div class="book-actions">
            <button class="secondary" onclick="openTelegram('${esc(telegram)}')">Telegram</button>
          </div>
        ` : ""}

      </div>
    </article>
  `;
}

function renderBooks() {
  const search = $("searchInput").value.toLowerCase().trim();
  const category = $("categoryFilter").value;

  const filtered = allBooks.filter(book => {
    const matchesSearch =
      (book.title || "").toLowerCase().includes(search) ||
      (book.author || "").toLowerCase().includes(search);

    const matchesCategory =
      !category || book.cat === category;

    return matchesSearch && matchesCategory;
  });

  $("booksList").innerHTML = filtered.length
    ? filtered.map(bookCard).join("")
    : "<p>Hozircha kitob topilmadi.</p>";
}

function getFavorites() {
  try {
    return JSON.parse(localStorage.getItem("booksavdo_favorites") || "[]");
  } catch {
    return [];
  }
}

function toggleFavorite(id) {
  let favorites = getFavorites();

  if (favorites.includes(id)) {
    favorites = favorites.filter(item => item !== id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem("booksavdo_favorites", JSON.stringify(favorites));

  renderBooks();
  renderFavorites();
}

function renderFavorites() {
  const favorites = getFavorites();

  const books = allBooks.filter(book =>
    favorites.includes(book.id)
  );

  $("favoritesList").innerHTML = books.length
    ? books.map(bookCard).join("")
    : "<p>Hozircha sevimli kitoblar yo‘q.</p>";
}

function callSeller(phone) {
  const cleanPhone = phone.replace(/[^\d+]/g, "");
  if (cleanPhone) location.href = "tel:" + cleanPhone;
}

function openTelegram(username) {
  const cleanUsername = username.replace(/[^a-zA-Z0-9_]/g, "");
  if (cleanUsername) {
    window.open("https://t.me/" + cleanUsername, "_blank");
  }
}

function showDetails(id) {
  const book = allBooks.find(item => item.id === id);

  if (!book) return;

  const description = book.description || "Ma’lumot kiritilmagan.";
  const locationText = [book.city, book.district].filter(Boolean).join(", ");

  alert(
    "Kitob: " + book.title +
    "\nMuallif: " + book.author +
    "\nNarxi: " + money(book.price) +
    "\nHolati: " + book.cond +
    "\nJoylashuv: " + locationText +
    "\n\nKitob haqida:\n" + description
  );
}

async function loadMyBooks() {
  if (!currentUser) return;

  const box = $("myBooks");
  box.textContent = "Yuklanmoqda...";

  const { data, error } = await db
    .from("books")
    .select("*")
    .eq("user_id", currentUser.id)
    .order("created_at", { ascending: false });

  if (error) {
    box.textContent = error.message;
    return;
  }

  if (!data || !data.length) {
    box.innerHTML = "<p>Siz hali kitob joylamagansiz.</p>";
    return;
  }

  box.innerHTML = data.map(book => `
    <div class="panel">

      <b>${esc(book.title)}</b>

      <p class="price">${money(book.price)}</p>

      <p class="muted">${esc(book.author)}</p>

      <p>${book.is_sold ? "Sotilgan" : "Sotuvda"}</p>

      <div class="book-actions">

        <button class="secondary"
          onclick="editBook('${book.id}')">
          Tahrirlash
        </button>

        <button class="secondary"
          onclick="toggleSold('${book.id}', ${!book.is_sold})">
          ${book.is_sold ? "Qayta sotuvga qo‘yish" : "Sotildi"}
        </button>

        <button class="danger"
          onclick="deleteBook('${book.id}')">
          O‘chirish
        </button>

      </div>
    </div>
  `).join("");
}

async function editBook(id) {
  const book = allBooks.find(item => item.id === id);

  if (!book || book.user_id !== currentUser?.id) {
    alert("Bu kitobni tahrirlash huquqingiz yo‘q.");
    return;
  }

  const title = prompt("Kitob nomi:", book.title);
  if (title === null) return;

  const author = prompt("Muallif:", book.author);
  if (author === null) return;

  const price = prompt("Narxi:", book.price);
  if (price === null) return;

  if (!title.trim() || !author.trim() || !Number.isFinite(Number(price)) || Number(price) < 0) {
    alert("Ma’lumotlarni to‘g‘ri kiriting.");
    return;
  }

  const { error } = await db
    .from("books")
    .update({
      title: title.trim(),
      author: author.trim(),
      price: Number(price)
    })
    .eq("id", id)
    .eq("user_id", currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Kitob yangilandi.");

  await loadBooks();
  await loadMyBooks();
}

async function toggleSold(id, sold) {
  if (!currentUser) return;

  const { error } = await db
    .from("books")
    .update({ is_sold: sold })
    .eq("id", id)
    .eq("user_id", currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadBooks();
  await loadMyBooks();
}

async function deleteBook(id) {
  if (!currentUser) return;

  const confirmed = confirm("Bu kitobni o‘chirmoqchimisiz?");

  if (!confirmed) return;

  const { error } = await db
    .from("books")
    .delete()
    .eq("id", id)
    .eq("user_id", currentUser.id);

  if (error) {
    alert(error.message);
    return;
  }

  alert("Kitob o‘chirildi.");

  await loadBooks();
  await loadMyBooks();
}

db.auth.onAuthStateChange((_event, session) => {
  currentUser = session?.user || null;
  currentProfile = currentUser?.user_metadata || null;

  setTimeout(async () => {
    await loadProfile();
  }, 0);
});

async function startApp() {
  const { data } = await db.auth.getSession();

  currentUser = data.session?.user || null;
  currentProfile = currentUser?.user_metadata || null;

  await loadBooks();
  await loadProfile();
}

startApp();

</script>
