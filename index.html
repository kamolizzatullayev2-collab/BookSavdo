<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BookSavdo</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{color-scheme:light;--bg:#faf6ef;--card:#fff;--ink:#2b2118;--mute:#7a6a5a;--acc:#1f5c4a;--acc2:#fff;--line:#e6dccd;--warn:#b5472a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.w{max-width:760px;margin:0 auto;padding:10px 14px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.logo{font-family:Georgia,serif;font-weight:700;font-size:21px}.logo b{color:var(--acc)}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:16px;margin-bottom:8px}
textarea{min-height:80px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--acc2);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--acc);border:1px solid var(--acc)}
button.r{background:transparent;color:var(--warn);border:1px solid var(--warn)}
button.s{padding:7px 10px;font-size:13px}
a.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--acc2);font-weight:600;text-align:center}
.hero{background:var(--acc);color:#f5efe4;border-radius:16px;padding:16px;margin-bottom:12px}
.hero h1{font-family:Georgia,serif;font-size:21px;margin:0 0 4px}.hero p{margin:0 0 10px;font-size:13px;opacity:.9}.hero input{margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:500}
.chip.on{background:var(--acc);color:var(--acc2);border-color:var(--acc)}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cnt{color:var(--mute);font-size:13px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer}
.cv{height:130px;display:flex;align-items:center;justify-content:center;font-size:42px;position:relative}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:3px 8px;border-radius:99px}
.hb{position:absolute;top:6px;right:6px;width:34px;height:34px;padding:0;border-radius:50%;background:rgba(255,255,255,.92);color:var(--warn);font-size:18px}
.b{padding:9px}.t{font-weight:700;font-family:Georgia,serif;font-size:15px}
.a,.m{color:var(--mute);font-size:12.5px}.p{color:var(--acc);font-weight:700;margin-top:3px}
.e{text-align:center;color:var(--mute);padding:34px 8px;grid-column:1/-1}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{background:none;color:var(--mute);font-size:11px;font-weight:500;padding:4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px}
.nav button span{font-size:20px}.nav button.on{color:var(--acc)}
.nav button.sell span{background:var(--acc);color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:-18px;font-size:26px}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;overflow:auto;padding:10px}.mo.o{display:block}
.sh{max-width:520px;margin:10px auto 30px;background:var(--bg);border-radius:18px;padding:16px;position:relative}
.sh h2{font-family:Georgia,serif;margin:0 0 10px;font-size:21px}
.x{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:50%}
.big{height:220px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:70px;position:relative;overflow:hidden;margin-bottom:10px}
.big img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.my{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.my .th{flex:0 0 64px;height:84px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.my .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.my .i{flex:1;min-width:0}
.bad{display:inline-block;background:var(--warn);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.er{color:var(--warn);font-size:14px;margin:0 0 8px}
.lb{font-size:12.5px;color:var(--mute);margin:0 0 3px;display:block}
</style>
</head>
<body>
<div class="w">
  <div class="bar"><div class="logo">📚 Book<b>Savdo</b></div><div id="who"></div></div>
  <div id="view"></div>
</div>
<div class="nav" id="nav">
  <button data-t="home"><span>🏠</span>Bosh sahifa</button>
  <button data-t="favs"><span>♡</span>Sevimlilar</button>
  <button class="sell" data-t="sell"><span>＋</span>Sotish</button>
  <button data-t="cab"><span>👤</span>Kabinet</button>
</div>
<div class="mo" id="mo"><div class="sh" id="sh"></div></div>
<script>
var SUPABASE_URL='https://lszzpfiptmgsjrrrkdwj.supabase.co';
var SUPABASE_ANON_KEY='sb_publishable_G72FGzaa4mFQe5PS77dZaQ_cZUlF3O5';
var tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#faf6ef');tg.setBackgroundColor('#faf6ef')}catch(e){}}
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
var CATS=[['Badiiy','📖','#e8c9a8'],['Darslik','🎓','#b8d4e3'],['Bolalar','🧸','#f2d0d6'],['Biznes','💼','#c9dcc0'],['Tarixiy','🏛️','#dcc9e6'],['Boshqa','📚','#d9d4c7']];
var CITIES=['Toshkent','Samarqand','Buxoro','Andijon','Farg’ona','Namangan','Qarshi','Nukus','Boshqa'];
var CONDS=['Yangidek','Yaxshi','O’rtacha','Eskirgan'];
var S={user:null,books:[],favs:new Set(),tab:'home',cat:'',city:'',sort:'new',q:'',err:''};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function cinfo(n){return CATS.filter(function(c){return c[0]===n})[0]||CATS[5]}
function opts(a,sel){return a.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function money(n){return Number(n).toLocaleString('uz-UZ')+' so’m'}
function hash(str){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function mail(a,b){return 'u'+hash(a.trim().toLowerCase()+'|'+b.trim().toLowerCase())+'@users.booksavdo.app'}
function openTg(u){u=String(u||'').replace(/^https?:\/\/t\.me\//,'').replace('@','').trim();var url='https://t.me/'+u;tg?tg.openTelegramLink(url):window.open(url,'_blank')}
function modal(html){$('sh').innerHTML='<button class="x" data-x="1">✕</button>'+html;$('mo').classList.add('o')}
function closeModal(){$('mo').classList.remove('o')}

/* ---------- ma’lumot ---------- */
async function loadBooks(){
  var r=await sb.from('books').select('*').order('created_at',{ascending:false}).limit(300);
  if(r.error){S.err='Yuklab bo’lmadi';S.books=[]}else{S.err='';S.books=r.data}
}
async function loadFavs(){
  S.favs=new Set();
  if(!S.user)return;
  var r=await sb.from('favorites').select('book_id');
  if(!r.error)r.data.forEach(function(x){S.favs.add(x.book_id)});
}
function who(){
  var n=S.user&&S.user.user_metadata&&S.user.user_metadata.first_name;
  $('who').innerHTML=S.user?'<span class="a">👤 '+esc(n||'Men')+'</span>':'<button class="s" data-auth="1">Kirish</button>';
}

/* ---------- sahifalar ---------- */
function card(b){
  var c=cinfo(b.cat),fav=S.favs.has(b.id);
  return '<div class="card" data-o="'+esc(b.id)+'"><div class="cv" style="background:'+c[2]+'">'+(b.image_url?'<img loading="lazy" src="'+esc(b.image_url)+'" alt="">':c[1])+
  '<button class="hb" data-f="'+esc(b.id)+'">'+(fav?'♥':'♡')+'</button><span class="tag">'+esc(b.cond)+'</span></div><div class="b"><div class="t">'+esc(b.title)+'</div><div class="a">'+esc(b.author||'—')+'</div><div class="m">📍 '+esc(b.city||'')+(b.district?', '+esc(b.district):'')+'</div><div class="p">'+money(b.price)+'</div></div></div>';
}
function fillGrid(){
  var t=S.q.toLowerCase();
  var r=S.books.filter(function(b){return !b.sold&&(!t||((b.title||'')+' '+(b.author||'')).toLowerCase().indexOf(t)>-1)&&(!S.cat||b.cat===S.cat)&&(!S.city||b.city===S.city)});
  r.sort(function(a,b){return S.sort==='cheap'?a.price-b.price:S.sort==='exp'?b.price-a.price:new Date(b.created_at)-new Date(a.created_at)});
  $('cnt').textContent=r.length+' ta kitob';
  $('grid').innerHTML=r.length?r.map(card).join(''):'<div class="e">'+(S.err||'Hozircha kitob yo’q. Birinchi bo’lib soting!')+'</div>';
}
function chips(){
  var all=[['','Hammasi']].concat(CATS.map(function(c){return[c[0],c[1]+' '+c[0]]}));
  $('chips').innerHTML=all.map(function(c){return '<button class="chip'+(S.cat===c[0]?' on':'')+'" data-c="'+c[0]+'">'+c[1]+'</button>'}).join('');
}
function setTab(t){
  S.tab=t;
  Array.prototype.forEach.call($('nav').children,function(b){b.classList.toggle('on',b.getAttribute('data-t')===t)});
  var v=$('view');who();
  if(t==='home'){
    v.innerHTML='<div class="hero"><h1>O’qilgan kitoblar — arzon narxda</h1><p>Kitobingizni soting yoki sevimli muallifingizni hamyonbop narxda toping.</p><input id="q" placeholder="Kitob yoki muallif qidiring…" value="'+esc(S.q)+'"></div><div class="chips" id="chips"></div><div class="flt"><select id="city"><option value="">Barcha shaharlar</option>'+opts(CITIES,S.city)+'</select><select id="sort"><option value="new">Yangilari</option><option value="cheap"'+(S.sort==='cheap'?' selected':'')+'>Arzon narx</option><option value="exp"'+(S.sort==='exp'?' selected':'')+'>Qimmat narx</option></select></div><div class="cnt" id="cnt"></div><div class="grid" id="grid"></div>';
    chips();fillGrid();
  }else if(t==='favs'){
    if(!S.user){v.innerHTML='<div class="e">Sevimlilarni ko’rish uchun kiring<div class="row" style="justify-content:center"><button data-auth="1">Kirish</button></div></div>';return}
    var r=S.books.filter(function(b){return S.favs.has(b.id)&&!b.sold});
    v.innerHTML='<h2 style="font-family:Georgia,serif;margin:6px 0 10px">♥ Sevimlilar</h2><div class="grid">'+(r.length?r.map(card).join(''):'<div class="e">Hozircha sevimli kitob yo’q</div>')+'</div>';
  }else if(t==='cab'){
    if(!S.user){v.innerHTML='<div class="e">Shaxsiy kabinet uchun kiring<div class="row" style="justify-content:center"><button data-auth="1">Kirish / Ro’yxatdan o’tish</button></div></div>';return}
    var n=S.user.user_metadata||{};
    var mine=S.books.filter(function(b){return b.user_id===S.user.id});
    v.innerHTML='<h2 style="font-family:Georgia,serif;margin:6px 0 2px">'+esc((n.first_name||'')+' '+(n.last_name||''))+'</h2><p class="a" style="margin:0 0 12px">Mening kitoblarim: '+mine.length+'</p>'+
    (mine.length?mine.map(function(b){var c=cinfo(b.cat);
      return '<div class="my"><div class="th" style="background:'+c[2]+'">'+(b.image_url?'<img src="'+esc(b.image_url)+'" alt="">':c[1])+'</div><div class="i"><div class="t">'+esc(b.title)+(b.sold?' <span class="bad">Sotildi</span>':'')+'</div><div class="p">'+money(b.price)+'</div><div class="row"><button class="s g" data-e="'+esc(b.id)+'">Tahrirlash</button><button class="s g" data-s="'+esc(b.id)+'">'+(b.sold?'Qaytarish':'Sotildi')+'</button><button class="s r" data-d="'+esc(b.id)+'">O’chirish</button></div></div></div>'}).join(''):'<div class="e">Hali kitob joylamagansiz</div>')+
    '<div class="row"><button class="g" data-out="1">Chiqish</button></div>';
  }
}
function refresh(){setTab(S.tab==='sell'?'home':S.tab)}

/* ---------- kirish ---------- */
function authForm(mode,err){
  var reg=mode==='reg';
  modal('<h2>'+(reg?'Ro’yxatdan o’tish':'Kirish')+'</h2><p class="a" style="margin-top:0">SMS, telefon raqam va email so’ralmaydi.</p>'+(err?'<p class="er">'+esc(err)+'</p>':'')+
  '<input id="an" placeholder="Ism" autocomplete="given-name"><input id="af" placeholder="Familiya" autocomplete="family-name"><input id="ap" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="'+(reg?'new-password':'current-password')+'">'+
  '<button id="ago" data-mode="'+mode+'" style="width:100%">'+(reg?'Ro’yxatdan o’tish':'Kirish')+'</button>'+
  '<p class="a" style="text-align:center">'+(reg?'Akkauntingiz bormi? <a href="#" data-auth="login">Kirish</a>':'Akkauntingiz yo’qmi? <a href="#" data-auth="reg">Ro’yxatdan o’tish</a>')+'</p><p class="a" style="font-size:12px">Parolni unutsangiz, uni tiklab bo’lmaydi: eslab qoling.</p>');
}
async function doAuth(mode){
  var a=$('an').value.trim(),f=$('af').value.trim(),p=$('ap').value;
  if(!a||!f||!p){authForm(mode,'Ism, familiya va parolni kiriting');return}
  if(p.length<6){authForm(mode,'Parol kamida 6 belgidan iborat bo’lsin');return}
  var em=mail(a,f),r;
  if(mode==='reg'){
    r=await sb.auth.signUp({email:em,password:p,options:{data:{first_name:a,last_name:f}}});
    if(r.error){authForm('reg',/already/i.test(r.error.message)?'Bu ism va familiya band. Familiyangizga raqam qo’shing yoki kirishni bosing.':'Ro’yxatdan o’tib bo’lmadi: '+r.error.message);return}
    if(!r.data.session){r=await sb.auth.signInWithPassword({email:em,password:p});if(r.error){authForm('reg','Kirish yopiq: Supabase’da Confirm email o’chirilmagan');return}}
  }else{
    r=await sb.auth.signInWithPassword({email:em,password:p});
    if(r.error){authForm('login','Ism, familiya yoki parol noto’g’ri');return}
  }
  closeModal();
}

/* ---------- kitob joylash / tahrirlash ---------- */
function shrink(file){return new Promise(function(res,rej){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var k=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej()},'image/jpeg',0.8)};img.onerror=rej;img.src=u})}
function sellForm(b){
  b=b||{};
  var phone=b.contact||'';
  try{phone=phone||localStorage.getItem('bs_phone')||''}catch(e){}
  modal('<h2>'+(b.id?'E’lonni tahrirlash':'Kitobni sotish')+'</h2><span class="lb">Kitob rasmi</span><input id="ph" type="file" accept="image/*">'+
  '<input id="ti" placeholder="Kitob nomi" value="'+esc(b.title)+'"><input id="au" placeholder="Muallif" value="'+esc(b.author)+'">'+
  '<input id="pr" type="number" inputmode="numeric" placeholder="Narxi (so’m)" value="'+esc(b.price)+'">'+
  '<select id="co">'+opts(CONDS,b.cond||'Yaxshi')+'</select><select id="ca">'+opts(CATS.map(function(c){return c[0]}),b.cat)+'</select>'+
  '<textarea id="de" placeholder="Kitob haqida qisqacha ma’lumot">'+esc(b.description)+'</textarea>'+
  '<select id="ci">'+opts(CITIES,b.city)+'</select><input id="di" placeholder="Tuman" value="'+esc(b.district)+'">'+
  '<input id="ct" type="tel" inputmode="tel" placeholder="Telefon raqami (majburiy)" value="'+esc(phone)+'">'+
  '<input id="tgm" placeholder="Telegram manzili, masalan @username (ixtiyoriy)" value="'+esc(b.telegram)+'">'+
  '<p class="er" id="fe"></p><button id="save" data-id="'+esc(b.id||'')+'" style="width:100%">'+(b.id?'Saqlash':'Joylash')+'</button>');
}
async function saveBook(id){
  var btn=$('save'),v=function(i){return $(i).value.trim()};
  var p={title:v('ti'),author:v('au'),price:Number($('pr').value),cond:$('co').value,cat:$('ca').value,description:v('de'),city:$('ci').value,district:v('di'),contact:v('ct'),telegram:v('tgm')};
  if(!p.title||!p.price||!p.contact){$('fe').textContent='Kitob nomi, narxi va telefon raqamini kiriting';return}
  btn.disabled=true;btn.textContent='Saqlanmoqda…';
  try{
    var f=$('ph').files[0];
    if(f){
      var blob=await shrink(f),path=Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
      var up=await sb.storage.from('covers').upload(path,blob,{contentType:'image/jpeg'});
      if(up.error)throw up.error;
      p.image_url=sb.storage.from('covers').getPublicUrl(path).data.publicUrl;
    }
    var r;
    if(id){r=await sb.from('books').update(p).eq('id',id)}
    else{
      var n=S.user.user_metadata||{};
      p.seller_id=S.user.id;p.seller_name=((n.first_name||'')+' '+(n.last_name||'')).trim();
      r=await sb.from('books').insert(p);
    }
    if(r.error)throw r.error;
    try{localStorage.setItem('bs_phone',p.contact)}catch(e){}
    closeModal();await loadBooks();setTab(id?'cab':'home');
  }catch(e){$('fe').textContent='Saqlab bo’lmadi. Qaytadan urinib ko’ring.';btn.disabled=false;btn.textContent='Joylash'}
}

/* ---------- tafsilot ---------- */
function detail(id){
  var b=S.books.filter(function(x){return x.id===id})[0];if(!b)return;
  var c=cinfo(b.cat),mine=S.user&&b.user_id===S.user.id,fav=S.favs.has(b.id);
  modal('<div class="big" style="background:'+c[2]+'">'+(b.image_url?'<img src="'+esc(b.image_url)+'" alt="">':c[1])+'</div>'+
  '<h2 style="margin-bottom:2px">'+esc(b.title)+'</h2><div class="a">'+esc(b.author||'—')+'</div><div class="p" style="font-size:22px;margin:6px 0">'+money(b.price)+'</div>'+
  '<div class="m">Holati: <b>'+esc(b.cond)+'</b> · '+esc(b.cat||'')+'</div><div class="m">📍 '+esc(b.city||'')+(b.district?', '+esc(b.district):'')+'</div>'+
  (b.description?'<p style="margin:10px 0">'+esc(b.description)+'</p>':'')+
  (b.seller_name?'<div class="m">Sotuvchi: '+esc(b.seller_name)+'</div>':'')+
  '<div class="row"><a class="btn" href="tel:'+esc(String(b.contact||'').replace(/[^+\d]/g,''))+'">📞 '+esc(b.contact)+'</a>'+
  (b.telegram?'<button data-tg="'+esc(b.telegram)+'">✈️ Telegram</button>':'')+
  '<button class="g" data-f="'+esc(b.id)+'" data-keep="1">'+(fav?'♥ Sevimli':'♡ Sevimlilarga')+'</button>'+(mine?'<button class="g" data-e="'+esc(b.id)+'">Tahrirlash</button>':'')+'</div>');
}

/* ---------- hodisalar ---------- */
async function toggleFav(id,keep){
  if(!S.user){authForm('login');return}
  if(S.favs.has(id)){S.favs.delete(id);await sb.from('favorites').delete().eq('book_id',id)}
  else{S.favs.add(id);await sb.from('favorites').insert({book_id:id})}
  if(keep)detail(id);
  if(S.tab==='home')fillGrid();else setTab(S.tab);
}
document.addEventListener('click',async function(e){
  var t=e.target.closest('[data-t],[data-o],[data-f],[data-c],[data-auth],[data-x],[data-e],[data-s],[data-d],[data-out],[data-tg],#ago,#save');
  if(!t)return;
  var g=function(k){return t.getAttribute(k)};
  if(t.id==='ago'){doAuth(g('data-mode'));return}
  if(t.id==='save'){saveBook(g('data-id'));return}
  if(g('data-auth')!==null){e.preventDefault();authForm(g('data-auth')==='reg'?'reg':'login');return}
  if(g('data-x')!==null){closeModal();return}
  if(g('data-tg')!==null){openTg(g('data-tg'));return}
  if(g('data-f')!==null){e.stopPropagation();toggleFav(g('data-f'),g('data-keep'));return}
  if(g('data-t')!==null){var tab=g('data-t');if(tab==='sell'){S.user?sellForm():authForm('login')}else setTab(tab);return}
  if(g('data-c')!==null){S.cat=g('data-c');chips();fillGrid();return}
  if(g('data-o')!==null){detail(g('data-o'));return}
  if(g('data-e')!==null){var b=S.books.filter(function(x){return x.id===g('data-e')})[0];if(b)sellForm(b);return}
  if(g('data-s')!==null){var k=S.books.filter(function(x){return x.id===g('data-s')})[0];if(k){await sb.from('books').update({sold:!k.sold}).eq('id',k.id);await loadBooks();setTab('cab')}return}
  if(g('data-d')!==null){if(confirm('E’lonni o’chirasizmi?')){await sb.from('books').delete().eq('id',g('data-d'));await loadBooks();setTab('cab')}return}
  if(g('data-out')!==null){await sb.auth.signOut();return}
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value.trim();fillGrid()}});
document.addEventListener('change',function(e){
  if(e.target.id==='city'){S.city=e.target.value;fillGrid()}
  if(e.target.id==='sort'){S.sort=e.target.value;fillGrid()}
});
$('mo').addEventListener('click',function(e){if(e.target===$('mo'))closeModal()});

(async function(){
  var s=await sb.auth.getSession();
  S.user=s.data.session?s.data.session.user:null;
  await Promise.all([loadBooks(),loadFavs()]);
  setTab('home');
  sb.auth.onAuthStateChange(async function(ev,sess){
    var nu=sess?sess.user:null;
    if((nu&&nu.id)===(S.user&&S.user.id))return;
    S.user=nu;await loadFavs();refresh();
  });
})();
</script>
</body>
</html>
