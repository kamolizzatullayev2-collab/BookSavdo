
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookSavdo — Kitobga ikkinchi hayot!</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf5;color:#292929}
header{background:#f47721;color:white;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:30px}
header p{margin:7px 0 0}
.container{max-width:1000px;margin:auto;padding:16px}
.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
h2{color:#e96c17}
.categories{display:flex;gap:8px;overflow:auto;margin:15px 0}
.categories button,.main-btn{border:0;background:#f47721;color:white;padding:11px 16px;border-radius:10px;white-space:nowrap}
.categories button.active{background:#292929}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px}
.card{background:white;border:1px solid #eee;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0000000b}
.cover{height:130px;background:#fff0e3;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:55px}
.card h3{font-size:16px;margin:10px 0 5px}
.muted{color:#777;font-size:13px}
.price{color:#e96c17;font-size:18px;font-weight:bold;margin:10px 0}
.card a{display:block;text-align:center;background:#f47721;color:white;text-decoration:none;padding:10px;border-radius:9px;margin-top:8px}
.card button{border:0;background:none;color:#e96c17;font-size:20px}
form{background:white;padding:16px;border-radius:14px;border:1px solid #eee;margin:25px 0}
form input,form select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font-size:15px}
form button{width:100%;padding:13px;background:#f47721;color:white;border:0;border-radius:10px;font-size:16px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>

<header>
<h1>📚 BookSavdo</h1>
<p>Kitobga ikkinchi hayot!</p>
</header>

<div class="container">
<h2>Kitoblarni toping</h2>
<input class="search" id="search" placeholder="Kitob yoki muallif nomini yozing...">

<div class="categories">
<button class="active" onclick="filterBooks('Barchasi',this)">Barchasi</button>
<button onclick="filterBooks('Badiiy',this)">Badiiy</button>
<button onclick="filterBooks('Biznes',this)">Biznes</button>
<button onclick="filterBooks('Tarix',this)">Tarix</button>
<button onclick="filterBooks('Darslik',this)">Darslik</button>
</div>

<div class="grid" id="books"></div>

<h2>📖 Kitobingizni soting</h2>
<form id="bookForm">
<input id="title" placeholder="Kitob nomi" required>
<input id="author" placeholder="Muallif" required>
<input id="price" type="number" placeholder="Narxi (so'm)" required>
<select id="category">
<option>Badiiy</option>
<option>Biznes</option>
<option>Tarix</option>
<option>Darslik</option>
</select>
<select id="condition">
<option>Yaxshi holatda</option>
<option>Yangi kabi</option>
<option>O‘qilgan, lekin yaxshi</option>
</select>
<input id="phone" placeholder="Telefon raqamingiz (+998...)">
<input id="telegram" placeholder="Telegram username (@username)">
<button type="submit">Kitobni e'lon qilish</button>
</form>
</div>

<footer>© 2026 BookSavdo. Kitobga ikkinchi hayot!</footer>

<script>
let books = JSON.parse(localStorage.getItem("booksavdo") || "[]");

if(books.length === 0){
books = [
{title:"O‘tkan kunlar",author:"Abdulla Qodiriy",price:35000,category:"Badiiy",condition:"Yaxshi holatda"},
{title:"Mehrobdan chayon",author:"Abdulla Qodiriy",price:30000,category:"Badiiy",condition:"O‘qilgan, lekin yaxshi"},
{title:"Boy ota, kambag‘al ota",author:"Robert Kiyosaki",price:45000,category:"Biznes",condition:"Yaxshi holatda"}
];
}

let currentCategory="Barchasi";

function save(){
localStorage.setItem("booksavdo",JSON.stringify(books));
}

function render(){
let search=document.getElementById("search").value.toLowerCase();
let list=books.filter(b=>
(currentCategory==="Barchasi"||b.category===currentCategory)&&
(b.title.toLowerCase().includes(search)||b.author.toLowerCase().includes(search))
);

document.getElementById("books").innerHTML=list.map((b,i)=>`
<div class="card">
<div class="cover">📚</div>
<h3>${escapeHTML(b.title)}</h3>
<div class="muted">${escapeHTML(b.author)}</div>
<div class="muted">${escapeHTML(b.condition||"")}</div>
<div class="price">${Number(b.price).toLocaleString("uz-UZ")} so‘m</div>
${b.phone?`<a href="tel:${encodeURIComponent(b.phone)}">📞 Qo‘ng‘iroq qilish</a>`:""}
${b.telegram?`<a href="https://t.me/${encodeURIComponent(b.telegram.replace("@",""))}" target="_blank">✈️ Telegram</a>`:""}
</div>`).join("") || "<p>Kitob topilmadi.</p>";
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function filterBooks(category,button){
currentCategory=category;
document.querySelectorAll(".categories button").forEach(b=>b.classList.remove("active"));
button.classList.add("active");
render();
}

document.getElementById("search").addEventListener("input",render);

document.getElementById("bookForm").addEventListener("submit",function(e){
e.preventDefault();
books.unshift({
title:document.getElementById("title").value,
author:document.getElementById("author").value,
price:Number(document.getElementById("price").value),
category:document.getElementById("category").value,
condition:document.getElementById("condition").value,
phone:document.getElementById("phone").value,
telegram:document.getElementById("telegram").value
});
save();
this.reset();
currentCategory="Barchasi";
render();
alert("Kitob e'lon qilindi!");
});

save();
render();
</script>
</body>
</html>
