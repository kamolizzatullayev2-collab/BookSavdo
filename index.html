<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookSavdo — Kitobga ikkinchi hayot!</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf5;color:#292929}
header{background:#ff7518;color:white;padding:18px}
header h1{margin:0;font-size:25px}
header p{margin:5px 0 0}
main{padding:16px;padding-bottom:90px}
input,select,textarea,button{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:1px solid #ddd;font-size:15px}
button{background:#ff7518;color:white;border:0;font-weight:bold}
.book{background:white;padding:12px;border-radius:14px;margin:12px 0;box-shadow:0 2px 8px #0001}
.book img{width:100%;height:190px;object-fit:cover;border-radius:10px}
.price{color:#ff7518;font-weight:bold;font-size:19px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;padding:12px 3px;box-shadow:0 -2px 10px #0001}
nav button{width:auto;background:white;color:#444;font-size:12px;padding:8px}
nav button.active{color:#ff7518}
.hidden{display:none}
h2{font-size:20px}
</style>
</head>
<body>

<header>
<h1>📚 BookSavdo</h1>
<p>Kitobga ikkinchi hayot!</p>
</header>

<main>
<section id="home">
<h2>Kitoblar bozori</h2>
<input id="search" placeholder="Kitob yoki muallifni qidiring..." oninput="loadBooks()">
<div id="books">Kitoblar yuklanmoqda...</div>
</section>

<section id="sell" class="hidden">
<h2>Kitob sotish</h2>
<input id="title" placeholder="Kitob nomi">
<input id="author" placeholder="Muallif">
<input id="price" type="number" placeholder="Narxi (so‘m)">
<select id="cat">
<option value="Badiiy">Badiiy</option>
<option value="Tarix">Tarix</option>
<option value="Biznes">Biznes</option>
<option value="Diniy">Diniy</option>
<option value="Bolalar">Bolalar</option>
<option value="Boshqa">Boshqa</option>
</select>
<select id="cond">
<option value="Yaxshi">Yaxshi holatda</option>
<option value="O‘rtacha">O‘rtacha holatda</option>
<option value="Yangi">Yangi</option>
</select>
<textarea id="description" placeholder="Kitob haqida qisqacha ma’lumot"></textarea>
<input id="city" placeholder="Shahar">
<input id="district" placeholder="Tuman">
<input id="phone" placeholder="Telefon raqam">
<input id="telegram" placeholder="Telegram username (@ bilan yoki @siz)">
<input id="photo" type="file" accept="image/*">
<button onclick="addBook()">Kitobni joylash</button>
</section>

<section id="profile" class="hidden">
<h2>Shaxsiy kabinet</h2>
<div id="auth">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Parol">
<button onclick="signUp()">Ro‘yxatdan o‘tish</button>
<button onclick="signIn()">Kirish</button>
</div>
<div id="account" class="hidden">
<p id="userEmail"></p>
<h3>Mening kitoblarim</h3>
<div id="myBooks"></div>
<button onclick="signOut()">Hisobdan chiqish</button>
</div>
</section>

<section id="favorites" class="hidden">
<h2>Sevimli kitoblar</h2>
<div id="favoriteBooks"></div>
</section>
</main>

<nav>
<button class="active" onclick="showPage('home',this)">🏠<br>Bosh sahifa</button>
<button onclick="showPage('home',this)">🔎<br>Qidiruv</button>
<button onclick="showPage('sell',this)">➕<br>Sotish</button>
<button onclick="showPage('favorites',this)">❤️<br>Sevimli</button>
<button onclick="showPage('profile',this)">👤<br>Profil</button>
</nav>

<script>
