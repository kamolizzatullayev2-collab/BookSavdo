<!DOCTYPE html>
<html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f07832"><title>BookSavdo</title>
<style>
:root{--o:#f07832;--od:#c85a20;--bg:#fff5ea;--ink:#29231f;--muted:#81766e;--line:#f0e1d4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,system-ui,sans-serif}header{background:var(--o);color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}.brand{font-size:25px;font-weight:850}.brand span{color:#5a2a12}.tag{font-size:12px;color:#fff0e4}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--o);color:white}.light{background:white;color:var(--od)}.outline{background:white;border:1px solid var(--line);color:var(--od)}.hero{background:linear-gradient(120deg,#f07832,#c85a20);color:white;padding:45px 5%}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.05;margin:0 0 14px}.hero p{max-width:550px;line-height:1.6;color:#fff0e4}.search{display:flex;gap:8px;max-width:560px}.search input{flex:1;min-width:0;padding:14px;border:0;border-radius:10px;font-size:15px}main{max-width:1300px;margin:auto;padding:30px 5% 55px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{margin:0}.muted{color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.chip{background:white;border:1px solid var(--line);color:#79675b;border-radius:30px}.chip.active{background:var(--o);color:white}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.book{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.cover{height:170px;display:grid;place-items:center;background:linear-gradient(145deg,#ffe0c7,#fff2e7);font-size:60px;position:relative}.heart{position:absolute;right:10px;top:10px;border-radius:50%;background:white;color:var(--od);padding:8px}.info{padding:13px}.info h3{margin:0 0 5px;font-size:16px}.author,.condition{font-size:12px;color:var(--muted)}.price{font-size:18px;font-weight:800;color:var(--od);margin:12px 0 5px}.actions{display:flex;gap:7px;margin-top:13px}.actions a{flex:1;text-align:center;text-decoration:none;padding:10px 5px;border-radius:9px;font-size:12px;font-weight:bold}.call{background:#fff0e4;color:#a94816}.telegram{background:#eaf5ff;color:#1475b8}.empty{grid-column:1/-1;background:white;padding:35px;text-align:center;border-radius:14px;color:var(--muted)}footer{text-align:center;background:#8f3d18;color:#fff0e4;padding:24px}.modal{display:none;position:fixed;inset:0;background:#17100dbb;z-index:5;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.panel{background:white;padding:22px;border-radius:16px;width:min(100%,460px);max-height:92vh;overflow:auto}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit}.field textarea{min-height:60px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){header{padding:13px 4%}.brand{font-size:22px}.hero{padding:38px 5%}main{padding:25px 4%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.cover{height:145px}.info{padding:11px}}
</style></head><body>
<header><div><div class="brand">Book<span>Savdo</span></div><div class="tag">Kitobga ikkinchi hayot!</div></div><button class="light" onclick="openForm()">＋ Kitob sotish</button></header>
<section class="hero"><h1>Yaxshi kitoblar yangi egasini kutmoqda.</h1><p>O‘qib bo‘lgan kitoblaringizni soting, boshqalarning sevimli kitoblarini hamyonbop narxda toping.</p><div class="search"><input id="search" placeholder="Kitob yoki muallifni qidiring..." oninput="render()"><button class="light" onclick="document.getElementById('books').scrollIntoView({behavior:'smooth'})">Qidirish</button></div></section>
<main id="books"><div class="head"><div><h2>Kitoblar</h2><div class="muted">Yangi e’lonlar va hamyonbop narxlar</div></div><button class="primary" onclick="openForm()">＋ E’lon joylash</button></div>
<div class="filters"><button class="chip active" data-cat="Barchasi" onclick="setCat(this)">Barchasi</button><button class="chip" data-cat="Badiiy" onclick="setCat(this)">Badiiy</button><button class="chip" data-cat="Biznes" onclick="setCat(this)">Biznes</button><button class="chip" data-cat="Bolalar" onclick="setCat(this)">Bolalar</button><button class="chip" data-cat="Ta’lim" onclick="setCat(this)">Ta’lim</button></div><div class="grid" id="grid"></div></main><footer>© 2026 BookSavdo · Kitobga ikkinchi hayot!</footer>
<div class="modal" id="modal" onclick="if(event.target===this)closeForm()"><div class="panel"><h2>Kitobni sotuvga qo‘yish</h2><form id="form">
<div class="field"><label>Kitob nomi</label><input name="title" required placeholder="O‘tkan kunlar"></div><div class="field"><label>Muallif</label><input name="author" required></div><div class="field"><label>Narxi (so‘m)</label><input name="price" type="number" min="1000" required></div><div class="field"><label>Kategoriya</label><select name="category"><option>Badiiy</option><option>Biznes</option><option>Bolalar</option><option>Ta’lim</option></select></div><div class="field"><label>Kitob holati</label><select name="condition"><option>Yaxshi</option><option>Yangi kabi</option><option>O‘qilgan, izlari bor</option></select></div><div class="field"><label>Telefon raqami</label><input name="phone" type="tel" required placeholder="+998 90 123 45 67"></div><div class="field"><label>Telegram username</label><input name="telegram" placeholder="@username"></div><div class="field"><label>Izoh (ixtiyoriy)</label><textarea name="description"></textarea></div><div class="modal-actions"><button type="button" class="outline" onclick="closeForm()">Bekor qilish</button><button class="primary">E’lonni qo‘shish</button></div></form></div></div>
<script>
const samples=[{id:1,title:"O‘tkan kunlar",author:"Abdulla Qodiriy",price:25000,category:"Badiiy",condition:"Yaxshi",phone:"",telegram:"",emoji:"📕"},{id:2,title:"Atom odatlar",author:"James Clear",price:45000,category:"Biznes",condition:"Yangi kabi",phone:"",telegram:"",emoji:"📗"},{id:3,title:"Kichkina shahzoda",author:"Antoine de Saint-Exupéry",price:30000,category:"Bolalar",condition:"Yaxshi",phone:"",telegram:"",emoji:"📘"},{id:4,title:"Mehrobdan chayon",author:"Abdulla Qodiriy",price:22000,category:"Badiiy",condition:"Yaxshi",phone:"",telegram:"",emoji:"📙"}];
let books=JSON.parse(localStorage.getItem("booksavdo_books")||"null")||samples;let favs=JSON.parse(localStorage.getItem("booksavdo_favs")||"[]");let cat="Barchasi";
function save(){localStorage.setItem("booksavdo_books",JSON.stringify(books));localStorage.setItem("booksavdo_favs",JSON.stringify(favs))}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){let q=document.getElementById("search").value.toLowerCase().trim();let list=books.filter(b=>(cat==="Barchasi"||b.category===cat)&&(`${b.title} ${b.author}`).toLowerCase().includes(q));let el=document.getElementById("grid");if(!list.length){el.innerHTML='<div class="empty">Kitob topilmadi. Birinchi bo‘lib e’lon joylang! 📚</div>';return}el.innerHTML=list.map(b=>{let phone=String(b.phone||"").replace(/[^\d+]/g,"");let user=String(b.telegram||"").trim().replace(/^@/,"");return `<article class="book"><div class="cover">${esc(b.emoji||"📚")}<button class="heart" onclick="toggleFav(${Number(b.id)})">${favs.includes(b.id)?"♥":"♡"}</button></div><div class="info"><h3>${esc(b.title)}</h3><div class="author">${esc(b.author)}</div><div class="price">${Number(b.price).toLocaleString("uz-UZ")} so‘m</div><div class="condition">${esc(b.condition)} · ${esc(b.category)}</div><div class="actions">${phone?`<a class="call" href="tel:${encodeURIComponent(phone)}">📞 Qo‘ng‘iroq</a>`:""}${user?`<a class="telegram" href="https://t.me/${encodeURIComponent(user)}" target="_blank" rel="noopener">✈️ Telegram</a>`:""}${!phone&&!user?'<span class="muted">Aloqa ma’lumoti yo‘q</span>':""}</div></div></article>`}).join("")}
function setCat(btn){cat=btn.dataset.cat;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x===btn));render()}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];save();render()}
function openForm(){document.getElementById("modal").classList.add("show")}function closeForm(){document.getElementById("modal").classList.remove("show")}
document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();let d=new FormData(e.target);books.unshift({id:Date.now(),title:d.get("title"),author:d.get("author"),price:Number(d.get("price")),category:d.get("category"),condition:d.get("condition"),phone:d.get("phone"),telegram:d.get("telegram"),description:d.get("description"),emoji:"📚"});save();e.target.reset();closeForm();cat="Barchasi";document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("active",x.dataset.cat==="Barchasi"));document.getElementById("search").value="";render()});render();
</script></body></html>
